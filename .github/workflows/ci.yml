name: ci
on:
  push:
    branches: ["fix/**", main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: stable, cache: false}
      - run: |
          go get gvisor.dev/gvisor@go
          go get -u ./...
          go mod tidy
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...