<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="v2-tun: Xray-free tunnel library in Go">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#14123a"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#f472b6;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f472b6;#22d3ee;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orbA">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="typed">
      <rect x="40" y="148" height="40" width="0">
        <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.5;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#grid)"/>

  <circle cx="150" cy="60" r="150" fill="url(#orbA)">
    <animate attributeName="cx" values="150;300;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;110;60" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="200" r="150" fill="url(#orbB)">
    <animate attributeName="cx" values="720;600;720" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;130;200" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(770 95)" fill="none">
    <circle r="64" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="10 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" stroke="#f472b6" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="16 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#ffffff" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="40" y="118" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="78" font-weight="800" fill="url(#title)" filter="url(#glow)">v2-tun</text>

  <g clip-path="url(#typed)">
    <text x="40" y="176" font-family="'JetBrains Mono','Fira Code','SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="28" fill="#e2e8f0">Xray-free tunnel library in Go</text>
  </g>
  <rect y="152" width="3" height="30" fill="#22d3ee">
    <animate attributeName="x" values="40;544;544;40" keyTimes="0;0.5;0.92;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.7s" fill="freeze"/>
      <rect x="40" y="206" width="146" height="30" rx="15" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="113" y="226" fill="#a5f3fc">payload engine</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.7s" fill="freeze"/>
      <rect x="198" y="206" width="137" height="30" rx="15" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.7"/>
      <text x="266" y="226" fill="#a7f3d0">TLS • REALITY</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.7s" fill="freeze"/>
      <rect x="347" y="206" width="213" height="30" rx="15" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.7"/>
      <text x="453" y="226" fill="#ddd6fe">WS • H2 • gRPC • XHTTP</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.7s" fill="freeze"/>
      <rect x="572" y="206" width="129" height="30" rx="15" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.7"/>
      <text x="636" y="226" fill="#fbcfe8">Hysteria 1/2</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.7s" fill="freeze"/>
      <rect x="713" y="206" width="53" height="30" rx="15" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.7"/>
      <text x="739" y="226" fill="#fde68a">SSH</text>
    </g>
  </g>
</svg>
